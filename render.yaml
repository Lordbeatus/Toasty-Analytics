services:
  - type: web
    name: toastyanalytics-api
    runtime: docker
    dockerfilePath: ./deployment/docker/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TOASTYANALYTICS_DB_URL
        fromDatabase:
          name: toastyanalytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: toastyanalytics-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: toastyanalytics-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: TOASTY_API_KEYS
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: redis
    name: toastyanalytics-redis
    plan: free
    ipAllowList: []

databases:
  - name: toastyanalytics-db
    databaseName: toastyanalytics
    user: toasty
    plan: free
