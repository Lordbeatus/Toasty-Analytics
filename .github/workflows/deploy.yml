name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          kubectl config use-context "${{ secrets.K8S_CONTEXT }}"

      - name: Create namespace
        run: |
          kubectl create namespace toastyanalytics --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply application secrets
        run: |
          kubectl create secret generic toastyanalytics-secrets \
            --from-literal=database-url="${{ secrets.DATABASE_URL }}" \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET_KEY }}" \
            --namespace=toastyanalytics \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render manifests
        run: |
          export IMAGE_TAG="${{ github.sha }}"
          envsubst < deployment/kubernetes/deployments.yaml > /tmp/deployments-rendered.yaml

      - name: Deploy
        run: kubectl apply -f /tmp/deployments-rendered.yaml --namespace=toastyanalytics

      - name: Apply Istio configuration
        run: kubectl apply -f deployment/kubernetes/istio-config.yaml --namespace=toastyanalytics

      - name: Wait for rollout
        run: |
          for service in grading-service meta-learning-service analytics-service api-gateway; do
            kubectl rollout status "deployment/$service" --namespace=toastyanalytics --timeout=5m
          done

      - name: Smoke test
        run: |
          endpoint=$(kubectl get service api-gateway -n toastyanalytics \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          test -n "$endpoint"
          curl -fsS "http://${endpoint}/health"
