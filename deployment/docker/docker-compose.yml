version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: toasty-postgres
    environment:
      POSTGRES_USER: toasty
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: toastyanalytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toasty"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: toasty-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Application with WebSocket & Event-Driven Architecture
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: toasty-api
    command: uvicorn toastyanalytics.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      - TOASTYANALYTICS_DB_URL=postgresql://toasty:password123@postgres:5432/toastyanalytics
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker (Background Jobs)
  worker:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: toasty-worker
    command: celery -A toastyanalytics.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ../../.env
    environment:
      - TOASTYANALYTICS_DB_URL=postgresql://toasty:password123@postgres:5432/toastyanalytics
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; exit(0 if os.path.exists(\"/tmp/celery.pid\") else 1)' 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Celery Beat (Scheduled Tasks)
  beat:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: toasty-beat
    command: celery -A toastyanalytics.celery_app beat --loglevel=info
    env_file:
      - ../../.env
    environment:
      - TOASTYANALYTICS_DB_URL=postgresql://toasty:password123@postgres:5432/toastyanalytics
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; exit(0)' 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
